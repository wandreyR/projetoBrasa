<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho — BRASA Pizzaria</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="brasa-header">
  <div class="brasa-logo">
    <span class="mark">BRA<em>SA</em></span>
    <span class="tagline">forno a lenha desde sempre</span>
  </div>
  <div class="header-actions">
    <nav class="header-nav">
      <a href="cardapio.html">Cardápio</a>
      <a href="montar_pizza.html">Monte a sua</a>
    </nav>
    <a href="carrinho.html" class="cart-link active" aria-current="page">
      Carrinho
      <span class="cart-badge" data-cart-badge>0</span>
    </a>
  </div>
</header>

<main class="page">

  <section class="hero" style="margin-bottom: 32px; padding-bottom: 28px;">
    <p class="eyebrow">Seu pedido</p>
    <h1>Carrinho</h1>
  </section>

  <div id="cartContent"></div>

  <form id="checkoutForm" class="checkout-card" hidden novalidate>
    <p class="eyebrow">Finalizar</p>
    <h2>Seus dados</h2>

    <div class="segmented" role="radiogroup" aria-label="Entrega ou retirada">
      <label><input type="radio" name="tipo_entrega" value="delivery" checked><span>Entrega</span></label>
      <label><input type="radio" name="tipo_entrega" value="retirada"><span>Retirar no balcão</span></label>
    </div>

    <div class="field-grid">
      <label class="field">
        <span>Nome</span>
        <input type="text" name="nome" autocomplete="name" required minlength="2" maxlength="120">
      </label>
      <label class="field">
        <span>Telefone (WhatsApp)</span>
        <input type="tel" name="telefone" autocomplete="tel" required placeholder="(62) 99999-0000"
               maxlength="20" title="Informe DDD + número">
      </label>
      <label class="field" id="bairroField">
        <span>Bairro</span>
        <select name="bairro_id" required>
          <option value="">Carregando bairros…</option>
        </select>
      </label>
      <label class="field" id="enderecoField">
        <span>Endereço de entrega</span>
        <input type="text" name="endereco" autocomplete="street-address" required maxlength="255"
               placeholder="Rua, número, complemento">
      </label>
      <label class="field field-full">
        <span>Observações <em>(opcional)</em></span>
        <textarea name="observacoes" rows="2" maxlength="500" placeholder="Ex.: sem cebola, interfone quebrado"></textarea>
      </label>
    </div>

    <h2 class="titulo-pagamento">Pagamento</h2>
    <p class="dica-pagamento" id="dicaPagamento">Você paga na entrega ou na retirada.</p>
    <div class="segmented" role="radiogroup" aria-label="Forma de pagamento">
      <label><input type="radio" name="forma_pagamento" value="pix" checked><span>Pix</span></label>
      <label><input type="radio" name="forma_pagamento" value="credito"><span>Crédito</span></label>
      <label><input type="radio" name="forma_pagamento" value="debito"><span>Débito</span></label>
      <label><input type="radio" name="forma_pagamento" value="dinheiro"><span>Dinheiro</span></label>
    </div>
    <div class="pix-previa" id="pixPrevia" hidden></div>
    <div class="field-grid" id="trocoField" hidden>
      <label class="field">
        <span>Troco para quanto? <em>(deixe vazio se não precisar)</em></span>
        <input type="text" name="troco_para" inputmode="decimal" placeholder="Ex.: 100">
      </label>
    </div>

    <div class="checkout-actions">
      <a href="cardapio.html" class="btn btn-ghost">Continuar comprando</a>
      <button type="submit" class="btn btn-primary" id="checkoutBtn">Confirmar pedido</button>
    </div>
  </form>

</main>


<script src="cart.js"></script>
<script src="mascaras.js"></script>
<script>
const checkoutForm = document.getElementById('checkoutForm');
const enderecoField = document.getElementById('enderecoField');
const bairroField = document.getElementById('bairroField');
const trocoField = document.getElementById('trocoField');
const pixPrevia = document.getElementById('pixPrevia');
let BAIRROS = [];
let PIX = { disponivel: false };

function escapeHTML(texto) {
  const div = document.createElement('div');
  div.textContent = texto == null ? '' : String(texto);
  return div.innerHTML;
}

function tipoEntregaSelecionado() {
  return checkoutForm.querySelector('input[name="tipo_entrega"]:checked').value;
}

function taxaSelecionada() {
  if (tipoEntregaSelecionado() !== 'delivery') return 0;
  const bairro = BAIRROS.find(b => String(b.id) === checkoutForm.elements.bairro_id.value);
  return bairro ? bairro.taxa : null; // null = ainda não escolheu o bairro
}

// Foto do item: pizza montada usa a foto da massa; bebida não tem tamanho
function fotoDoItem(item) {
  if (item.tipo === 'custom') {
    const massa = (item.ingredientes && item.ingredientes[0]) || 'Tradicional';
    const id = { Fina: 'fina', Integral: 'integral' }[massa] || 'tradicional';
    return `img/ingredientes/${id}.jpg`;
  }
  return `img/${item.tamanho ? 'pizzas' : 'bebidas'}/${item.id}.jpg`;
}

function pizzaThumbSmallHTML(item) {
  return `<img class="foto-item" src="${fotoDoItem(item)}" alt="" width="56" height="56" loading="lazy"
               onerror="this.style.visibility='hidden'">`;
}

/* ---------- Preços atualizados do banco ----------
   O carrinho guarda o preço do momento em que o item foi adicionado. Se o dono mudou
   o preço depois, atualiza aqui para o cliente ver o mesmo valor que será cobrado. */
async function atualizarPrecos() {
  try {
    const [pizzas, bebidas, montagem] = await Promise.all([
      apiPublica('/cardapio/pizzas'), apiPublica('/cardapio/bebidas'), apiPublica('/cardapio/montagem'),
    ]);
    const ingredientes = [...montagem.massas, ...montagem.molhos, ...montagem.coberturas];
    const cart = getCart();
    let mudou = false;
    cart.forEach(item => {
      let preco = null;
      if (item.tipo === 'custom') {
        const base = montagem.tamanhos.find(t => t.codigo === item.tamanho);
        const nomes = Array.isArray(item.ingredientes) ? item.ingredientes : [];
        if (base) preco = base.preco_base + nomes.reduce((soma, nome) => {
          const ing = ingredientes.find(i => i.nome === nome);
          return soma + (ing ? ing.preco_adicional : 0);
        }, 0);
      } else if (item.tamanho) {
        const pizza = pizzas.find(p => p.slug === item.id);
        if (pizza) preco = { P: pizza.preco_p, M: pizza.preco_m, G: pizza.preco_g }[item.tamanho];
      } else {
        const bebida = bebidas.find(b => b.slug === item.id || b.nome === item.nome);
        if (bebida) preco = bebida.preco;
      }
      if (preco !== null && Math.abs(preco - item.precoUnit) > 0.001) {
        item.precoUnit = preco;
        mudou = true;
      }
    });
    if (mudou) {
      saveCart(cart);
      renderCart();
      showToast('Atualizamos os preços do carrinho com os valores de hoje', 4000);
    }
  } catch (e) { /* sem API: mantém os preços do carrinho; a API cobra o valor oficial */ }
}

async function carregarBairros() {
  const select = checkoutForm.elements.bairro_id;
  try {
    BAIRROS = await apiPublica('/cardapio/bairros');
    select.innerHTML = '<option value="">Escolha o bairro…</option>' + BAIRROS.map(b =>
      `<option value="${b.id}">${escapeHTML(b.nome)} — ${b.taxa ? formatPrice(b.taxa) : 'grátis'}</option>`).join('');
    if (!BAIRROS.length) select.innerHTML = '<option value="">Sem entrega no momento — retire no balcão</option>';
  } catch (e) {
    select.innerHTML = '<option value="">Não foi possível carregar os bairros</option>';
  }
  renderCart();
}

function renderCart() {
  const container = document.getElementById('cartContent');
  const cart = getCart();

  if (cart.length === 0) {
    checkoutForm.hidden = true;
    container.innerHTML = `
      <div class="empty-state">
        <div class="pizza-thumb"></div>
        <h3>Seu carrinho está vazio</h3>
        <p>Que tal escolher uma pizza do cardápio ou montar a sua?</p>
        <a href="cardapio.html" class="btn btn-dark">Ver cardápio</a>
      </div>
    `;
    return;
  }

  const itemsHTML = cart.map(item => `
    <div class="cart-item">
      <div class="thumb">${pizzaThumbSmallHTML(item)}</div>
      <div class="info">
        <h4>${escapeHTML(item.nome)}${item.tamanho ? ` — ${escapeHTML(item.tamanho)}` : ''}</h4>
        <p class="meta">${escapeHTML(item.detalhes)}</p>
      </div>
      <div class="price-col">
        <span class="price">${formatPrice(item.precoUnit * item.qtd)}</span>
        <div class="qty-control">
          <button type="button" data-minus="${item.customId}" aria-label="Diminuir quantidade">−</button>
          <span class="qty-val">${item.qtd}</span>
          <button type="button" data-plus="${item.customId}" aria-label="Aumentar quantidade">+</button>
        </div>
        <button type="button" class="remove-link" data-remove="${item.customId}">Remover</button>
      </div>
    </div>
  `).join('');

  const subtotal = getCartTotal();
  const taxa = taxaSelecionada();
  const textoTaxa = tipoEntregaSelecionado() !== 'delivery' ? 'Grátis (retirada)'
    : taxa === null ? 'Escolha o bairro' : taxa ? formatPrice(taxa) : 'Grátis';

  container.innerHTML = `
    <div class="cart-list">${itemsHTML}</div>
    <div class="summary-card">
      <div class="summary-row">
        <span>Subtotal</span>
        <span>${formatPrice(subtotal)}</span>
      </div>
      <div class="summary-row">
        <span>Taxa de entrega</span>
        <span>${textoTaxa}</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span class="val">${formatPrice(subtotal + (taxa || 0))}</span>
      </div>
    </div>
  `;
  checkoutForm.hidden = false;

  container.querySelectorAll('[data-plus]').forEach(btn =>
    btn.addEventListener('click', () => { updateQty(btn.dataset.plus, 1); renderCart(); })
  );
  container.querySelectorAll('[data-minus]').forEach(btn =>
    btn.addEventListener('click', () => { updateQty(btn.dataset.minus, -1); renderCart(); })
  );
  container.querySelectorAll('[data-remove]').forEach(btn =>
    btn.addEventListener('click', () => { removeFromCart(btn.dataset.remove); renderCart(); showToast('Item removido'); })
  );
}

const PAGAMENTO_TEXTO = { pix: 'Pix', credito: 'cartão de crédito', debito: 'cartão de débito', dinheiro: 'dinheiro' };

function renderConfirmacao(pedido) {
  checkoutForm.hidden = true;
  checkoutForm.reset();
  const entrega = pedido.tipo_entrega === 'delivery'
    ? `Vamos entregar em <strong>${escapeHTML(pedido.endereco_entrega)}</strong> (${escapeHTML(pedido.bairro_nome)}).`
    : 'Avisaremos pelo telefone quando estiver pronto para retirada.';
  const pagamento = pedido.forma_pagamento === 'pix'
    ? 'Pagamento: <strong>Pix</strong> — pague agora pelo QR Code abaixo e envie o comprovante.'
    : `Pagamento: <strong>${PAGAMENTO_TEXTO[pedido.forma_pagamento] || pedido.forma_pagamento}</strong>`
      + (pedido.troco_para ? ` (troco para ${formatPrice(pedido.troco_para)})` : '') + ' na entrega/retirada.';
  document.getElementById('cartContent').innerHTML = `
    <div class="empty-state order-confirmed">
      <div class="pizza-thumb"></div>
      <p class="eyebrow">Pedido nº ${pedido.id}</p>
      <h3>Pedido enviado para o forno!</h3>
      <p>${entrega} Total: <strong>${formatPrice(pedido.total)}</strong>.<br>${pagamento}</p>
      ${pedido.forma_pagamento === 'pix' ? '<div id="painelPix" class="painel-pix-alvo"></div>' : ''}
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <a href="${linkAcompanhar(pedido.codigo_acompanhamento)}" class="btn btn-primary">Acompanhar meu pedido</a>
        <a href="cardapio.html" class="btn btn-ghost">Voltar ao cardápio</a>
      </div>
    </div>
  `;
  if (pedido.forma_pagamento === 'pix') {
    renderPainelPix(document.getElementById('painelPix'), pedido.codigo_acompanhamento);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function atualizarCamposEntrega() {
  const delivery = tipoEntregaSelecionado() === 'delivery';
  enderecoField.hidden = !delivery;
  bairroField.hidden = !delivery;
  enderecoField.querySelector('input').required = delivery;
  bairroField.querySelector('select').required = delivery;
  renderCart();
}

// Entrega x retirada: mostra/esconde endereço e bairro, recalcula a taxa
checkoutForm.querySelectorAll('input[name="tipo_entrega"]').forEach(radio =>
  radio.addEventListener('change', atualizarCamposEntrega)
);
checkoutForm.elements.bairro_id.addEventListener('change', renderCart);

// Dinheiro: pergunta o troco
function atualizarCamposPagamento() {
  const forma = checkoutForm.elements.forma_pagamento.value;
  trocoField.hidden = forma !== 'dinheiro';
  pixPrevia.hidden = forma !== 'pix' || !PIX.disponivel;
  document.getElementById('dicaPagamento').textContent = forma === 'pix'
    ? 'Com Pix você paga logo depois de confirmar o pedido e envia o comprovante.'
    : 'Você paga na entrega ou na retirada.';
}
checkoutForm.querySelectorAll('input[name="forma_pagamento"]').forEach(radio =>
  radio.addEventListener('change', atualizarCamposPagamento)
);

// Chave Pix da pizzaria: aparece assim que o cliente escolhe Pix
async function carregarPix() {
  try { PIX = await apiPublica('/cardapio/pix'); } catch (e) { PIX = { disponivel: false }; }
  const radioPix = checkoutForm.querySelector('input[name="forma_pagamento"][value="pix"]');
  if (!PIX.disponivel) {
    // sem chave cadastrada: Pix fica indisponível e o padrão passa a ser crédito
    radioPix.disabled = true;
    radioPix.nextElementSibling.textContent = 'Pix (indisponível)';
    if (radioPix.checked) checkoutForm.querySelector('input[name="forma_pagamento"][value="credito"]').checked = true;
  } else {
    pixPrevia.innerHTML = `
      <p class="pix-rotulo">Chave Pix da pizzaria</p>
      <div class="pix-copia">
        <input type="text" readonly value="${escapeHTML(PIX.chave)}" aria-label="Chave Pix">
        <button type="button" class="btn btn-dark" id="copiarChave">Copiar</button>
      </div>
      <p class="dica-pix">Favorecido: <b>${escapeHTML(PIX.nome)}</b>. Depois de confirmar o pedido mostramos o
        <b>QR Code com o valor exato</b> e você envia o comprovante por aqui.</p>`;
    document.getElementById('copiarChave').addEventListener('click', async () => {
      const copiou = await copiarTexto(PIX.chave);
      if (!copiou) pixPrevia.querySelector('input').select();
      showToast(copiou ? 'Chave Pix copiada' : 'Selecionado: use Ctrl+C para copiar');
    });
  }
  atualizarCamposPagamento();
}

// Loja fechada/pausada: o botão avisa em vez de enviar
document.addEventListener('brasa:loja', (e) => {
  const botao = document.getElementById('checkoutBtn');
  botao.disabled = !e.detail.aberto;
  botao.textContent = e.detail.aberto ? 'Confirmar pedido' : 'Pizzaria fechada agora';
});

aplicarMascaraTelefone(checkoutForm.elements.telefone);
initCheckout(checkoutForm, { onSuccess: renderConfirmacao });
renderCart();
carregarBairros();
carregarPix();
atualizarPrecos();
carregarStatusLoja();
</script>

</body>
</html>
