server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index cardapio.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML/CSS/JS: o navegador sempre confere se há versão nova (responde 304 se não mudou),
    # assim uma atualização do site aparece na hora, sem precisar limpar o cache
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
