<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comanda — BRASA Pizzaria</title>
<style>
  /* Comanda para impressora térmica de 80 mm (também funciona em A4) */
  @page { size: 80mm auto; margin: 4mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Courier New', monospace; font-size: 13px; color: #000; background: #fff; }
  .comanda { width: 72mm; margin: 0 auto; padding: 8px 0; }
  h1 { font-size: 20px; text-align: center; margin: 0; letter-spacing: 2px; }
  .centro { text-align: center; }
  .grande { font-size: 22px; font-weight: 700; }
  hr { border: 0; border-top: 1px dashed #000; margin: 8px 0; }
  .item { margin: 6px 0; }
  .item b { font-size: 14px; }
  .det { display: block; padding-left: 14px; font-size: 12px; }
  .obs { border: 2px solid #000; padding: 6px; font-weight: 700; margin: 8px 0; }
  .linha { display: flex; justify-content: space-between; }
  .total { font-size: 16px; font-weight: 700; }
  .tag { display: inline-block; border: 2px solid #000; padding: 2px 8px; font-weight: 700; }
  @media screen { body { background: #eee; } .comanda { background: #fff; padding: 12px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.2); } }
</style>
</head>
<body>
<div class="comanda" id="comanda">Carregando…</div>

<script src="staff.js"></script>
<script>
const PAGAMENTO = { pix: 'PIX', credito: 'CARTÃO CRÉDITO', debito: 'CARTÃO DÉBITO', dinheiro: 'DINHEIRO' };
const params = new URLSearchParams(location.search);

function brl(v) { return formatPrice(v); }

function render(p) {
  const criado = parseDataApi(p.criado_em);
  const entrega = p.tipo_entrega === 'delivery';
  const troco = p.forma_pagamento === 'dinheiro' && p.troco_para
    ? `<div class="linha"><span>Troco p/ ${brl(p.troco_para)}</span><b>levar ${brl(p.troco_para - p.total)}</b></div>` : '';
  document.getElementById('comanda').innerHTML = `
    <h1>BRASA</h1>
    <div class="centro">forno a lenha</div>
    <hr>
    <div class="centro grande">PEDIDO #${p.id}</div>
    <div class="centro">${criado.toLocaleDateString('pt-BR')} ${criado.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div>
    <div class="centro" style="margin-top:6px"><span class="tag">${entrega ? 'ENTREGA' : 'RETIRADA'}</span></div>
    <hr>
    <div><b>${escapeHTML(p.cliente_nome || '')}</b></div>
    <div>${escapeHTML(p.cliente_telefone || '')}</div>
    ${entrega ? `<div>${escapeHTML(p.endereco_entrega || '')}</div><div><b>${escapeHTML(p.bairro_nome || '')}</b></div>` : ''}
    <hr>
    ${p.itens.map(i => `
      <div class="item"><b>${i.quantidade}x ${escapeHTML(i.nome)}${i.tamanho ? ` (${i.tamanho})` : ''}</b>
        ${i.detalhes && i.tipo === 'custom' ? `<span class="det">${escapeHTML(i.detalhes)}</span>` : ''}
      </div>`).join('')}
    ${p.observacoes ? `<div class="obs">OBS: ${escapeHTML(p.observacoes)}</div>` : ''}
    <hr>
    <div class="linha"><span>Subtotal</span><span>${brl(p.subtotal)}</span></div>
    <div class="linha"><span>Entrega</span><span>${brl(p.taxa_entrega)}</span></div>
    <div class="linha total"><span>TOTAL</span><span>${brl(p.total)}</span></div>
    <hr>
    <div class="linha"><span>Pagamento</span><b>${PAGAMENTO[p.forma_pagamento] || 'A COMBINAR'}</b></div>
    ${troco}
    <div class="centro" style="margin-top:6px"><b>${p.pago ? '*** PAGO ***' : 'COBRAR NA ENTREGA'}</b></div>
    <hr>
    <div class="centro">Obrigado pela preferência!</div>`;
}

(async () => {
  const sessao = getSessao();
  if (!sessao) {
    document.getElementById('comanda').textContent = 'Entre na tela da cozinha para imprimir comandas.';
    return;
  }
  try {
    const resp = await fetch(`${API_URL}/pedidos/${encodeURIComponent(params.get('id'))}`, {
      headers: { Authorization: `Bearer ${sessao.token}` },
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    render(await resp.json());
    if (params.get('imprimir') === '1') setTimeout(() => window.print(), 150);
  } catch (e) {
    document.getElementById('comanda').textContent = `Não foi possível carregar o pedido (${e.message}).`;
  }
})();
</script>
</body>
</html>
