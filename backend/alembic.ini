# Configuração do Alembic (migrações do banco).
# A URL do banco vem de app/database.py (variáveis DB_* do .env), não daqui.
#
#   alembic upgrade head                          # aplica as migrações pendentes
#   alembic revision --autogenerate -m "o que mudou"   # gera uma migração nova a partir dos models
#
# Em produção (Docker) as migrações rodam sozinhas quando o backend inicia.

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
